<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Meghalaya Historical Imagery Visualizer</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PHJlY3QgeD0iMC41IiB5PSIwLjUiIHdpZHRoPSIzMSIgaGVpZ2h0PSIzMSIgcng9IjciIGZpbGw9IiMwZjEzMTciIHN0cm9rZT0iIzI3MmYzNyIgc3Ryb2tlLXdpZHRoPSIxIi8+PGcgdHJhbnNmb3JtPSJ0cmFuc2xhdGUoMSAxKSBzY2FsZSgxLjI1KSIgZmlsbD0ibm9uZSIgc3Ryb2tlLXdpZHRoPSIyIiBzdHJva2UtbGluZWpvaW49InJvdW5kIiBzdHJva2UtbGluZWNhcD0icm91bmQiPjxwYXRoIGQ9Ik0xMiAzIEwyMSA3LjUgTDEyIDEyIEwzIDcuNSBaIiBzdHJva2U9IiNmZjhhNGMiLz48cGF0aCBkPSJNMyAxMiBMMTIgMTYuNSBMMjEgMTIiIHN0cm9rZT0iI2I2ZjQ0MSIvPjxwYXRoIGQ9Ik0zIDE2LjUgTDEyIDIxIEwyMSAxNi41IiBzdHJva2U9IiNmZjhhNGMiLz48L2c+PC9zdmc+">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet" />

<style>
  :root{
    --bg:#0a0c0e; --panel-solid:#0f1317; --panel:rgba(15,19,23,.9);
    --accent:#b6f441; --accent-dim:rgba(182,244,65,.12); --warn:#ff8a4c; --blue:#b3d4f0;
    --text:#e9eef2; --muted:#8a97a2; --muted-dim:#5d6873;
    --border:#222a31; --border-strong:#2e3942; --shadow:0 10px 30px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;width:100%;overflow:hidden;background:var(--bg);color:var(--text);
    font-family:'Space Grotesk',ui-sans-serif,system-ui,sans-serif}
  #map{position:absolute;inset:0}
  #map-b{position:absolute;inset:0;z-index:2;display:none;clip-path:inset(0 0 0 50%);background:transparent}
  #map-b .maplibregl-canvas{background:transparent}
  #map-b.on{display:block}
  .swipe-divider{position:absolute;top:0;bottom:0;left:50%;width:0;z-index:3;display:none;pointer-events:none}
  .swipe-divider.on{display:block}
  .swipe-line{position:absolute;top:0;bottom:0;left:-1.5px;width:3px;background:var(--accent);box-shadow:0 0 0 1px rgba(10,12,14,.55),0 0 14px rgba(182,244,65,.55)}
  .swipe-handle{position:absolute;top:50%;left:0;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;
    background:var(--panel-solid);border:2px solid var(--accent);box-shadow:0 4px 16px rgba(0,0,0,.5),0 0 14px rgba(182,244,65,.35);
    display:flex;align-items:center;justify-content:center;cursor:ew-resize;pointer-events:auto;color:var(--accent)}
  .swipe-handle svg{width:22px;height:22px}
  .swipe-tag{position:absolute;top:16px;padding:5px 11px;border-radius:8px;background:var(--panel-solid);border:1px solid var(--border);
    font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.06em;white-space:nowrap;box-shadow:var(--shadow)}
  .swipe-tag.a{right:calc(100% + 14px);color:var(--blue)}
  .swipe-tag.b{left:calc(100% + 14px);color:var(--accent)}

  .left-stack{position:absolute;top:14px;left:14px;z-index:1000;width:290px;
    display:flex;flex-direction:column;gap:12px;overflow:visible;max-height:calc(100vh - 28px)}
  .app-title{display:flex;align-self:flex-start;width:max-content;max-width:none;align-items:center;gap:11px;
    background:var(--panel-solid);border:1px solid var(--border);border-radius:12px;
    box-shadow:var(--shadow);padding:10px 15px}
  .app-title-mark{flex:none}
  .app-title-main{font-family:'Syne',sans-serif;font-size:14px;font-weight:800;
    letter-spacing:-.01em;line-height:1;color:var(--text);white-space:nowrap}
  .app-title-div{width:1px;height:15px;background:var(--border-strong);flex:none}
  .app-title-sub{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.16em;white-space:nowrap;flex:none}
  .app-title-sub .yl{color:var(--accent)} .app-title-sub .yd{color:var(--warn)}

  .stack-scroll{display:flex;flex-direction:column;gap:12px;overflow-y:auto;overflow-x:hidden;padding-right:2px}
  .panel{width:290px;background:var(--panel);backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;flex:none}
  .panel-head{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid #1c242b}
  .logo{width:3px;height:13px;border-radius:2px;background:var(--warn);flex:none}
  .logo.vec{background:var(--blue)}
  .panel-head h1{margin:0;flex:1;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase}
  .icbtn{flex:none;width:22px;height:22px;border-radius:6px;background:transparent;border:none;color:var(--muted-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
  .icbtn:hover{color:var(--text);background:#1c242b}
  .icbtn svg{width:15px;height:15px}
  .pbody{padding:14px;display:flex;flex-direction:column;gap:13px}

  .seg{display:flex;gap:4px;background:#141a1f;border:1px solid #1f2730;border-radius:11px;padding:3px}
  .seg-btn{flex:1;text-align:center;font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--muted);padding:8px;border-radius:8px;background:transparent;border:none;cursor:pointer}
  .seg-btn.on{background:var(--accent);color:#0a0c0e}

  .ctl{display:flex;flex-direction:column;gap:7px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.05em;color:var(--muted)}
  .ctl .row{display:flex;justify-content:space-between;align-items:center}
  .ctl #op-val{color:var(--accent)}
  input[type=range]{accent-color:var(--accent);cursor:pointer;margin:0}

  .legend{display:flex;flex-direction:column;gap:6px}
  .legend-cap{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-dim)}
  .legend-bar{height:10px;border-radius:5px;background:linear-gradient(90deg,#0b3d0b,#2f7a30,#8fbf4f,#e6efb0)}
  .legend-labels{display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.03em}

  .status{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.05em;color:var(--muted-dim)}
  .status.load{color:var(--warn)} .status.ok{color:var(--accent)} .status.err{color:#ff6b6b}

  /* vectors / layers panel */
  .upload{border:1.5px dashed #2e3942;border-radius:9px;padding:9px 11px;display:flex;align-items:center;gap:8px;justify-content:center;
    font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted-dim);cursor:pointer;line-height:1.35;transition:.15s;text-align:left}
  .upload:hover,.upload.over{border-color:var(--accent);color:var(--muted);background:var(--accent-dim)}
  .upload .u-ic{flex:none;width:15px;height:15px;color:var(--muted)}
  .upload b{color:var(--text);display:block;font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:600;margin-bottom:0}
  .upload .u-hint{opacity:.8}
  .list{display:flex;flex-direction:column;gap:2px}
  .lrow-switch{display:flex;align-items:center;gap:9px;padding:5px 2px}
  .lrow-switch .vname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:'Space Grotesk',sans-serif;font-size:13px;color:var(--text)}
  .sw-btn{width:auto;height:auto;padding:0}
  .sw{display:block;width:34px;height:19px;border-radius:10px;background:#222a31;border:1px solid #2e3942;position:relative;transition:.15s}
  .sw::after{content:'';position:absolute;top:1.5px;left:2px;width:13px;height:13px;border-radius:50%;background:#5d6873;transition:.15s}
  .sw.on{background:var(--accent-dim);border-color:var(--accent)}
  .sw.on::after{background:var(--accent);left:16px}
  .lrow{display:flex;align-items:center;gap:8px;padding:6px 2px;border-radius:8px;font-family:'Space Grotesk',sans-serif;font-size:12.5px;color:var(--text)}
  .lrow:hover{background:#141a1f}
  .lrow.muted{color:var(--muted-dim)}
  .lrow.muted .dot{opacity:.35}
  .lrow .dot{flex:none;width:9px;height:9px;border-radius:50%}
  .lrow .lname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lrow .icbtn.active,.lrow-switch .icbtn.active{color:var(--accent)}
  .lrow .icbtn.active:hover,.lrow-switch .icbtn.active:hover{color:var(--accent);background:#1c242b}
  .btn-clear{font-family:'Space Grotesk',sans-serif;font-size:11.5px;color:var(--muted);background:#161c22;border:1px solid #2a333b;border-radius:8px;padding:7px;cursor:pointer;align-self:flex-end}
  .vec-status{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted-dim)}
  .vec-status.ok{color:var(--accent)} .vec-status.err{color:#ff6b6b}

  /* popups */
  .maplibregl-popup-content{background:#0f1317!important;border:1px solid #2a333b!important;color:#e9eef2!important;border-radius:10px!important;padding:10px 12px!important;box-shadow:0 8px 24px rgba(0,0,0,.55)!important;font-family:'Space Grotesk',sans-serif}
  .maplibregl-popup-tip{border-top-color:#2a333b!important;border-bottom-color:#2a333b!important}
  .maplibregl-popup-close-button{color:#8a97a2!important;font-size:17px!important;padding:2px 6px!important}
  .mp-name{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--accent);font-size:13px;letter-spacing:.02em}
  .mp-sub{color:var(--muted);font-size:12px;margin-top:3px}

  /* ---- timeline (old-viewer style) ---- */
  .timeline{position:absolute;left:50%;transform:translateX(-50%);bottom:22px;z-index:1000;
    width:min(620px,calc(100vw - 28px));background:var(--panel);backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:16px 20px 14px;display:flex;flex-direction:column;gap:11px}
  .tl-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .tl-head{display:flex;align-items:baseline;gap:11px;min-width:0;flex-wrap:wrap}
  .tl-year{font-family:'JetBrains Mono',monospace;font-size:30px;font-weight:700;line-height:1;color:var(--accent);letter-spacing:.02em}
  .tl-badge{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.08em;background:var(--accent);color:#0a0c0e;padding:3px 9px;border-radius:20px}
  .tl-fade{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:.04em}
  .tl-fade b{color:var(--warn);font-weight:600}
  .tl-ctrls{display:flex;gap:8px;flex:none}
  .tl-btn{flex:none;width:38px;height:38px;border-radius:10px;background:#141a1f;border:1px solid #2a333b;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
  .tl-btn:hover{border-color:var(--accent)}
  .tl-btn.play-on{background:var(--warn);border-color:var(--warn);color:#0a0c0e}
  .tl-btn svg{width:16px;height:16px;fill:currentColor}
  .tl-compare svg{fill:none}
  .tl-btn.compare-on{background:var(--accent);border-color:var(--accent);color:#0a0c0e}
  .tl-compare-row{display:flex;align-items:center;justify-content:center;gap:9px;padding:9px 0 2px;margin-top:8px;border-top:1px solid #1a2127}
  .cmp-lbl{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.06em}
  .cmp-lbl.a{color:var(--blue)} .cmp-lbl.b{color:var(--accent)}
  #cmp-a,#cmp-b{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;color:var(--text);background:#141a1f;
    border:1px solid #2a333b;border-radius:8px;padding:6px 9px;cursor:pointer;outline:none}
  #cmp-a{color:var(--blue)} #cmp-b{color:var(--accent)}
  #cmp-a:hover,#cmp-b:hover{border-color:var(--accent)}
  .cmp-vs{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted-dim)}
  #scrub{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;background:#2e3942;outline:none}
  #scrub::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);border:3px solid var(--warn);box-shadow:0 0 0 4px rgba(255,138,76,.22);cursor:pointer;margin-top:-7px}
  #scrub::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid var(--warn);box-shadow:0 0 0 4px rgba(255,138,76,.22);cursor:pointer}
  .tl-years{display:flex;justify-content:space-between}
  .tl-years button{background:none;border:none;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted-dim);cursor:pointer;padding:2px 3px;letter-spacing:.02em}
  .tl-years button.on{color:var(--accent);font-weight:700}
  .tl-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:3px;border-top:1px solid #1a2127}
  .tl-snap{display:flex;align-items:center;gap:8px;font-family:'Space Grotesk',sans-serif;font-size:12px;color:var(--muted);cursor:pointer;user-select:none}
  .tl-snap input{display:none}
  .tl-snap .sw{width:34px;height:19px;border-radius:10px;background:#222a31;border:1px solid #2e3942;position:relative;transition:.15s;flex:none}
  .tl-snap .sw::after{content:'';position:absolute;top:1.5px;left:2px;width:13px;height:13px;border-radius:50%;background:#5d6873;transition:.15s}
  .tl-snap input:checked + .sw{background:var(--accent-dim);border-color:var(--accent)}
  .tl-snap input:checked + .sw::after{background:var(--accent);left:16px}
  .tl-hint{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted-dim);letter-spacing:.03em;flex:1;text-align:center}
  .tl-speed{display:flex;align-items:center;gap:8px;font-family:'Space Grotesk',sans-serif;font-size:12px;color:var(--muted)}
  .tl-speed input{width:80px}

  .maplibregl-ctrl-group{background:var(--panel-solid)!important;border:1px solid var(--border)!important}
  .maplibregl-ctrl-group button+button{border-top:1px solid var(--border)!important}

  @media (max-width:760px){
    .left-stack{width:min(86vw,300px)}
    .panel{width:100%}
    .app-title{width:auto;max-width:100%;flex-wrap:wrap}
    .app-title-main{white-space:normal;font-size:13px}
    .timeline{bottom:14px;padding:13px 15px 11px}
    .tl-year{font-size:24px}
    .tl-hint{display:none}
    .tl-speed input{width:56px}
  }
</style>
</head>
<body>

<div class="left-stack">
  <div class="app-title">
    <svg class="app-title-mark" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3 L21 7.5 L12 12 L3 7.5 Z" stroke="#ff8a4c" stroke-width="1.5"/>
      <path d="M3 12 L12 16.5 L21 12" stroke="#b6f441" stroke-width="1.5"/>
      <path d="M3 16.5 L12 21 L21 16.5" stroke="#ff8a4c" stroke-width="1.5"/>
    </svg>
    <span class="app-title-main">Meghalaya Historical Imagery Visualizer</span>
    <span class="app-title-div"></span>
    <span class="app-title-sub"><span class="yl">2015</span><span class="yd">–</span><span class="yl">2025</span></span>
  </div>

  <div class="stack-scroll">
    <div class="panel">
      <div class="panel-head"><span class="logo"></span><h1>Imagery · COG</h1>
        <button class="icbtn" id="gear" title="Reset opacity" aria-label="Reset opacity">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
      <div class="pbody">
        <div class="upload" id="raster-drop">
          <svg class="u-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          <span><b>Load raster files</b><span class="u-hint"> · GeoTIFF (COG) · PNG · JPEG</span></span>
          <input type="file" id="raster-file" accept=".tif,.tiff,.png,.jpg,.jpeg" multiple hidden />
        </div>
        <div class="seg" id="mode-seg">
          <button class="seg-btn on" data-mode="sat">Satellite</button>
          <button class="seg-btn" data-mode="ndvi">NDVI</button>
        </div>
        <label class="ctl">
          <span class="row"><span>Opacity</span><span id="op-val">100%</span></span>
          <input type="range" id="opacity" min="0" max="100" value="100" style="width:100%" />
        </label>
        <div class="legend" id="legend" hidden>
          <div class="legend-cap">NDVI · vegetation</div>
          <div class="legend-bar"></div>
          <div class="legend-labels"><span>Dense</span><span>Sparse / bare</span></div>
        </div>
        <div class="list" id="img-list"></div>
        <div class="status" id="status">Starting…</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><span class="logo vec"></span><h1>Vectors</h1></div>
      <div class="pbody">
        <div class="upload" id="drop">
          <svg class="u-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.9 17.4 12 21l-8.9-3.6a1 1 0 0 1-.6-.9V6.6a1 1 0 0 1 .6-.9L12 2l8.9 3.6a1 1 0 0 1 .6.9v10.9a1 1 0 0 1-.6.9Z"/><path d="M12 21V11"/><path d="M20.5 5.7 12 11 3.5 5.7"/></svg>
          <span><b>Add vector</b><span class="u-hint"> · KML · GeoJSON · Shapefile (.zip) · GeoPackage</span></span>
          <input type="file" id="file" accept=".zip,.kml,.kmz,.geojson,.json,.gpkg" multiple hidden />
        </div>
        <div class="list" id="vec-list"></div>
        <div class="vec-status" id="vec-status"></div>
        <button class="btn-clear" id="clear-parcel">Clear vectors</button>
      </div>
    </div>
  </div>
</div>

<!-- ================= Timeline ================= -->
<div class="timeline" id="timeline">
  <div class="tl-top">
    <div class="tl-head">
      <span class="tl-year" id="ro-year">2018</span>
      <span class="tl-badge" id="ro-mode">RGB</span>
      <span class="tl-fade" id="ro-fade"></span>
    </div>
    <div class="tl-ctrls">
      <button class="tl-btn" id="prev" aria-label="Previous year"><svg viewBox="0 0 24 24"><path d="M15 5l-8 7 8 7z"/></svg></button>
      <button class="tl-btn" id="play" aria-label="Play"><svg viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></svg></button>
      <button class="tl-btn" id="next" aria-label="Next year"><svg viewBox="0 0 24 24"><path d="M9 5l8 7-8 7z"/></svg></button>
      <button class="tl-btn tl-compare" id="compare-toggle" aria-label="Compare two years" title="Compare two years"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M5 8l-3 4 3 4M19 8l3 4-3 4"/></svg></button>
    </div>
  </div>
  <div class="tl-compare-row" id="compare-row" hidden>
    <span class="cmp-lbl a">A</span>
    <select id="cmp-a"></select>
    <span class="cmp-vs">vs</span>
    <select id="cmp-b"></select>
    <span class="cmp-lbl b">B</span>

<script type="module">

const BASE = new URL('data/', location.href).href;
const YEARS = [2015, 2016, 2017, 2018, 2019, 2020, 2025];
const N = YEARS.length;
let pos = 3, mode = 'sat', opacity = 1, snap = false, speed = 50;
let playing = false, playTimer = null, rafId = null, lastT = 0;
let shown = new Set();
// swipe-compare state
let compareOn = false, cmpA = 2015, cmpB = 2025, swipeX = 0.5, mapB = null, mapBReady = false, shownB = new Set();

const PLAY_SVG  = '<svg viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></svg>';
const PAUSE_SVG = '<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';

// ---------- shared icons + palette for layer rows ----------
const EYE_SVG    = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>';

const fileFor = (y, m) => (m === 'sat' ? 'Meghalaya_S2_' + y + '_COG.tif' : 'NDVI_' + y + '_COG.tif');

const $ = id => document.getElementById(id);

const map = new maplibregl.Map({

map.on('load', () => {

  // imagery (14 hidden layers, below labels)
  YEARS.forEach(y => ['sat', 'ndvi'].forEach(m => {

      if (g.type === 'Polygon') holes.push(g.coordinates[0]);

    const world = [[-180, -85], [180, -85], [180, 85], [-180, 85], [-180, -85]];

    map.addLayer({ id: 'meg-mask', type: 'fill', source: 'meg-mask',
      paint: { 'fill-color': '#0a0c0e', 'fill-antialias': false, 'fill-opacity': ['interpolate', ['linear'], ['zoom'], 3.5, 0, 6, 1] } }, firstSymbol);
  }).catch(err => console.error('Boundary mask failed:', err));

  wireControls();

});

map.on('sourcedata', (e) => {
  const y = YEARS[Math.round(pos)];

});
map.on('error', (e) => console.error('MapLibre error:', e && e.error));

// ---------- vectors: districts + clustered villages ----------
function addVectors() {
  // districts (line + invisible fill for clicks + label)
  map.addSource('districts', { type: 'geojson', data: 'data/vectors/Meghalaya_Districts_named.geojson' });
  map.addLayer({ id: 'dist-fill', type: 'fill', source: 'districts', paint: { 'fill-color': '#000000', 'fill-opacity': 0 } });
  map.addLayer({ id: 'dist-line', type: 'line', source: 'districts', paint: { 'line-color': '#b3d4f0', 'line-width': 1.6, 'line-opacity': 0.85 } });
  map.addLayer({ id: 'dist-label', type: 'symbol', source: 'districts', layout: {
    'text-field': ['get', 'distname'], 'text-font': ['Open Sans Semibold'], 'text-size': 11, 'text-letter-spacing': .03 },
    paint: { 'text-color': '#b3d4f0', 'text-halo-color': '#0a0c0e', 'text-halo-width': 1.3 } });

  // villages (clustered points) — small solid green dot for single villages
  map.addSource('villages', { type: 'geojson', data: 'data/vectors/Meghalaya_Villages.geojson', cluster: true, clusterRadius: 46, clusterMaxZoom: 12 });
  // cluster: soft translucent outer glow ring (modern layered look)
  map.addLayer({ id: 'vil-cluster-glow', type: 'circle', source: 'villages', filter: ['has', 'point_count'], layout: { visibility: 'none' },
    paint: { 'circle-color': '#b6f441', 'circle-opacity': 0.18, 'circle-blur': 0.35,
      'circle-radius': ['step', ['get', 'point_count'], 20, 50, 26, 200, 34] } });
  // cluster: solid inner core
  map.addLayer({ id: 'vil-clusters', type: 'circle', source: 'villages', filter: ['has', 'point_count'], layout: { visibility: 'none' },
    paint: { 'circle-color': '#c7f95a', 'circle-opacity': 0.95, 'circle-stroke-width': 2, 'circle-stroke-color': 'rgba(10,12,14,0.55)',
      'circle-radius': ['step', ['get', 'point_count'], 12, 50, 16, 200, 21] } });
  map.addLayer({ id: 'vil-count', type: 'symbol', source: 'villages', filter: ['has', 'point_count'], layout: { visibility: 'none',
    'text-field': ['get', 'point_count_abbreviated'], 'text-font': ['Open Sans Semibold'], 'text-size': 11 }, paint: { 'text-color': '#0a0c0e' } });
  // individual village: bright white core + lime ring, grows with zoom for visibility on any basemap
  map.addLayer({ id: 'vil-point', type: 'circle', source: 'villages', filter: ['!', ['has', 'point_count']], layout: { visibility: 'none' },
    paint: {
      'circle-color': '#ffffff', 'circle-opacity': 0.95,
      'circle-radius': ['interpolate', ['linear'], ['zoom'], 8, 3, 11, 4.5, 14, 6.5, 17, 9],
      'circle-stroke-width': ['interpolate', ['linear'], ['zoom'], 8, 1.5, 14, 2.5, 17, 3],
      'circle-stroke-color': '#b6f441' } });
  map.addLayer({ id: 'vil-label', type: 'symbol', source: 'villages', filter: ['!', ['has', 'point_count']], minzoom: 11, layout: { visibility: 'none',
    'text-field': ['get', 'HAB_NAME'], 'text-font': ['Open Sans Regular'], 'text-size': 10, 'text-offset': [0, 1], 'text-anchor': 'top' },
    paint: { 'text-color': '#e9eef2', 'text-halo-color': '#0a0c0e', 'text-halo-width': 1.4 } });

  // interactions
  map.on('click', 'dist-fill', e => {
    const p = e.features[0].properties;
    new maplibregl.Popup({ closeButton: true }).setLngLat(e.lngLat)

  map.on('click', 'vil-point', e => {

  });
  map.on('click', 'vil-clusters', e => {
    const f = map.queryRenderedFeatures(e.point, { layers: ['vil-clusters'] })[0];

      map.easeTo({ center: f.geometry.coordinates, zoom: z })).catch(() => {});
  });
  ['dist-fill', 'vil-point', 'vil-clusters'].forEach(l => {

  );
  fetch('data/vectors/Meghalaya_Districts_named.geojson').then(r => r.json()).then(gj => {
    const e = vecLayers.find(x => x.id === 'districts'); if (e) e.bounds = bboxOf(gj); renderVecList();
  }).catch(() => {});
  fetch('data/vectors/Meghalaya_Villages.geojson').then(r => r.json()).then(gj => {
    const e = vecLayers.find(x => x.id === 'villages'); if (e) e.bounds = bboxOf(gj); renderVecList();
  }).catch(() => {});
  renderVecList();
}

// ---------- core render (crossfade + timeline UI) ----------
function render() {
  if (compareOn) { renderCompare(); return; }
  const lo = Math.floor(pos);
  let hi = Math.min(lo + 1, N - 1);
  let frac = pos - lo;
  if (snap) { frac = 0; hi = lo; }

  const loId = lid(YEARS[lo], mode), hiId = lid(YEARS[hi], mode);
  const want = new Map();
  want.set(loId, opacity);
  if (frac > 0.001 && hiId !== loId) want.set(hiId, opacity * frac);
  shown.forEach(id => { if (!want.has(id) && map.getLayer(id)) map.setLayoutProperty(id, 'visibility', 'none'); });
  want.forEach((op, id) => { if (!map.getLayer(id)) return; map.setLayoutProperty(id, 'visibility', 'visible'); map.setPaintProperty(id, 'raster-opacity', op); });
  shown = new Set(want.keys());

  const near = Math.round(pos);
  $('ro-year').textContent = YEARS[near];
  $('ro-mode').textContent = modeLabel();
  $('ro-fade').innerHTML = (frac > 0.02 && frac < 0.98 && hi !== lo)
    ? (YEARS[lo] + ' <b>⇄</b> ' + YEARS[hi] + ' · ' + Math.round(frac * 100) + '%') : '';
  document.querySelectorAll('#tl-years button').forEach(b => b.classList.toggle('on', +b.dataset.i === near));
  $('legend').hidden = (mode !== 'ndvi');
  const pct = (pos / (N - 1)) * 100;
  $('scrub').style.background = 'linear-gradient(90deg, var(--accent) ' + pct + '%, #2e3942 ' + pct + '%)';
  if (map.isSourceLoaded && map.isSourceLoaded(loId)) setStatus(YEARS[near] + ' · ' + modeLabel(), 'ok');
  else setStatus('Loading ' + YEARS[near] + '…', 'load');
}

function setPos(p) { pos = Math.max(0, Math.min(N - 1, p)); $('scrub').value = pos; render(); }
function step(d) { setPos(Math.round(pos) + d); }

function intervalMs() { return 2600 - speed * 21; }
function secPerYear() { return (2600 - speed * 21) / 1000; }
function stepPlay() {
  clearTimeout(playTimer);
  playTimer = setTimeout(() => { let n = Math.round(pos) + 1; if (n >= N) n = 0; setPos(n); if (playing) stepPlay(); }, intervalMs());
}
function frame(t) {
  if (!playing) return;
  if (!lastT) lastT = t;
  const dt = (t - lastT) / 1000; lastT = t;
  let p = pos + dt / secPerYear(); if (p >= N - 1) p = 0;
  pos = p; $('scrub').value = pos; render();
  rafId = requestAnimationFrame(frame);
}
function startPlay() { if (snap) stepPlay(); else { lastT = 0; rafId = requestAnimationFrame(frame); } }
function stopPlay() { clearTimeout(playTimer); playTimer = null; if (rafId) { cancelAnimationFrame(rafId); rafId = null; } }
function togglePlay() {
  playing = !playing;
  const b = $('play'); b.classList.toggle('play-on', playing); b.innerHTML = playing ? PAUSE_SVG : PLAY_SVG;
  if (playing) startPlay(); else stopPlay();
}

// ---------- vector upload (zip-shp / kml / kmz / geojson / gpkg) ----------
async function parseFile(file) {
  const name = file.name.toLowerCase();
  if (name.endsWith('.geojson') || name.endsWith('.json')) return JSON.parse(await file.text());
  if (name.endsWith('.kml')) {
    const { kml } = await import('https://esm.sh/@tmcw/togeojson@5');
    return kml(new DOMParser().parseFromString(await file.text(), 'text/xml'));
  }
  if (name.endsWith('.kmz')) {
    const JSZip = (await import('https://esm.sh/jszip@3')).default;
    const { kml } = await import('https://esm.sh/@tmcw/togeojson@5');
    const zip = await JSZip.loadAsync(await file.arrayBuffer());
    const key = Object.keys(zip.files).find(f => f.toLowerCase().endsWith('.kml'));
    if (!key) throw new Error('no kml in kmz');
    return kml(new DOMParser().parseFromString(await zip.files[key].async('text'), 'text/xml'));
  }
  if (name.endsWith('.zip')) {
    const shp = (await import('https://esm.sh/shpjs@6')).default;
    let gj = await shp(await file.arrayBuffer());
    if (Array.isArray(gj)) gj = { type: 'FeatureCollection', features: gj.flatMap(x => x.features || []) };
    return gj;
  }
  if (name.endsWith('.gpkg')) return await parseGeoPackage(file);
  throw new Error('unsupported');
}

// ---- minimal GeoPackage (sqlite + WKB) reader — best effort, EPSG:4326 assumed ----
async function parseGeoPackage(file) {
  const initSqlJs = (await import('https://esm.sh/sql.js@1.10.3')).default;
  const SQL = await initSqlJs({ locateFile: f => 'https://esm.sh/sql.js@1.10.3/dist/' + f });
  const db = new SQL.Database(new Uint8Array(await file.arrayBuffer()));
  const contents = db.exec("SELECT table_name FROM gpkg_contents WHERE data_type='features'");
  if (!contents.length) throw new Error('no feature tables in gpkg');
  const table = contents[0].values[0][0];
  const gc = db.exec('SELECT column_name FROM gpkg_geometry_columns WHERE table_name=\'' + table + '\'');
  const geomCol = gc.length ? gc[0].values[0][0] : 'geom';
  const res = db.exec('SELECT * FROM "' + table + '"');
  if (!res.length) return { type: 'FeatureCollection', features: [] };
  const cols = res[0].columns, gi = cols.indexOf(geomCol);
  const features = res[0].values.map(row => {
    const props = {}; cols.forEach((c, i) => { if (i !== gi) props[c] = row[i]; });
    let geometry = null;
    try { geometry = gpkgBlobToGeoJSON(row[gi]); } catch (e) { geometry = null; }
    return geometry ? { type: 'Feature', properties: props, geometry } : null;
  }).filter(Boolean);
  return { type: 'FeatureCollection', features };
}
function gpkgBlobToGeoJSON(bytes) {
  if (!bytes || bytes.length < 8 || bytes[0] !== 0x47 || bytes[1] !== 0x50) throw new Error('not a gpkg geometry');
  const flags = bytes[3];
  if (flags & 0x10) return null; // empty geometry
  const envBytes = [0, 32, 48, 48, 64][(flags >> 1) & 0x07] || 0;
  const off = bytes.byteOffset + 8 + envBytes;
  return wkbToGeoJSON(new DataView(bytes.buffer, off, bytes.byteLength - 8 - envBytes));
}
function wkbToGeoJSON(dv) {
  let o = 0;
  const little = dv.getUint8(o) === 1; o += 1;
  const type = dv.getUint32(o, little); o += 4;
  const base = type % 1000;
  const extraDims = type >= 3000 ? 2 : type >= 1000 ? 1 : 0;
  const pt = () => { const x = dv.getFloat64(o, little); o += 8; const y = dv.getFloat64(o, little); o += 8; o += 8 * extraDims; return [x, y]; };
  const line = () => { const n = dv.getUint32(o, little); o += 4; const a = []; for (let i = 0; i < n; i++) a.push(pt()); return a; };
  const poly = () => { const n = dv.getUint32(o, little); o += 4; const a = []; for (let i = 0; i < n; i++) a.push(line()); return a; };
  switch (base) {
    case 1: return { type: 'Point', coordinates: pt() };
    case 2: return { type: 'LineString', coordinates: line() };
    case 3: return { type: 'Polygon', coordinates: poly() };
    case 4: { const n = dv.getUint32(o, little); o += 4; const a = []; for (let i = 0; i < n; i++) { o += 5; a.push(pt()); } return { type: 'MultiPoint', coordinates: a }; }
    case 5: { const n = dv.getUint32(o, little); o += 4; const a = []; for (let i = 0; i < n; i++) { o += 5; a.push(line()); } return { type: 'MultiLineString', coordinates: a }; }
    case 6: { const n = dv.getUint32(o, little); o += 4; const a = []; for (let i = 0; i < n; i++) { o += 5; a.push(poly()); } return { type: 'MultiPolygon', coordinates: a }; }
    default: throw new Error('unsupported wkb geometry type ' + type);
  }
}

function bboxOf(gj) {
  let mnx = 180, mny = 90, mxx = -180, mxy = -90, any = false;
  const eat = c => { if (typeof c[0] === 'number') { any = true; mnx = Math.min(mnx, c[0]); mxx = Math.max(mxx, c[0]); mny = Math.min(mny, c[1]); mxy = Math.max(mxy, c[1]); } else c.forEach(eat); };
  const feats = gj.type === 'FeatureCollection' ? gj.features : [gj];
  feats.forEach(f => f && f.geometry && eat(f.geometry.coordinates));
  return any ? [[mnx, mny], [mxx, mxy]] : null;
}
function pickLabelProp(gj) {
  const feats = gj.type === 'FeatureCollection' ? gj.features : [gj];
  const f = feats.find(x => x && x.properties && Object.keys(x.properties).length);
  if (!f) return null;
  const prefer = ['name', 'Name', 'NAME', 'distname', 'HAB_NAME', 'title', 'Title', 'label', 'Label'];
  for (const k of prefer) if (k in f.properties) return k;
  return Object.keys(f.properties).find(k => typeof f.properties[k] === 'string') || null;
}

// ---------- dynamic vector layer list ----------
function rowBuiltin(e) {
  return '<div class="lrow-switch" data-id="' + e.id + '">' +
    '<button class="icbtn sw-btn" data-act="eye" title="Toggle visibility"><span class="sw' + (e.visible ? ' on' : '') + '"></span></button>' +
    '<span class="vname">' + e.name + '</span>' +
    (e.labelLayerId ? '<button class="icbtn' + (e.labelOn ? ' active' : '') + '" data-act="label" title="Toggle labels">' + TAG_SVG + '</button>' : '') +
    (e.bounds ? '<button class="icbtn" data-act="zoom" title="Zoom to layer">' + EXPAND_SVG + '</button>' : '') +
    '</div>';
}
function rowUpload(e) {
  const eyeColor = e.visible ? e.color : 'var(--muted-dim)';
  const rows = [
    '<button class="icbtn" data-act="eye" title="Toggle visibility" style="color:' + eyeColor + '">' + (e.visible ? EYE_SVG : EYE_OFF_SVG) + '</button>',
    '<span class="dot" style="background:' + e.color + '"></span>',
    '<span class="lname" title="' + e.name.replace(/"/g, '&quot;') + '">' + e.name + '</span>',
    e.labelLayerId ? '<button class="icbtn' + (e.labelOn ? ' active' : '') + '" data-act="label" title="Toggle labels">' + TAG_SVG + '</button>' : '',
    e.bounds ? '<button class="icbtn" data-act="zoom" title="Zoom to layer">' + EXPAND_SVG + '</button>' : '',
    '<button class="icbtn" data-act="remove" title="Remove">' + X_SVG + '</button>'
  ].join('');
  return '<div class="lrow' + (e.visible ? '' : ' muted') + '" data-id="' + e.id + '">' + rows + '</div>';
}
function renderVecList() {
  $('vec-list').innerHTML = vecLayers.map(e => e.removable ? rowUpload(e) : rowBuiltin(e)).join('');
}
function toggleVecVisibility(e) {
  e.visible = !e.visible;
  const v = e.visible ? 'visible' : 'none';
  e.layerIds.forEach(l => map.getLayer(l) && map.setLayoutProperty(l, 'visibility', v));
  if (e.labelLayerId && map.getLayer(e.labelLayerId)) map.setLayoutProperty(e.labelLayerId, 'visibility', (e.visible && e.labelOn) ? 'visible' : 'none');
  renderVecList();
}
function toggleVecLabel(e) {
  e.labelOn = !e.labelOn;
  if (e.labelLayerId && map.getLayer(e.labelLayerId)) map.setLayoutProperty(e.labelLayerId, 'visibility', (e.visible && e.labelOn) ? 'visible' : 'none');
  renderVecList();
}
function zoomToVecBounds(e) { if (e.bounds) map.fitBounds(e.bounds, { padding: 90, maxZoom: 15, duration: 900 }); }
function removeVecLayer(e) {
  e.layerIds.forEach(l => map.getLayer(l) && map.removeLayer(l));
  if (e.labelLayerId && map.getLayer(e.labelLayerId)) map.removeLayer(e.labelLayerId);
  if (map.getSource(e.id)) map.removeSource(e.id);
  vecLayers = vecLayers.filter(x => x !== e);
  renderVecList();
}
function clearVectors() { vecLayers.filter(e => e.removable).forEach(removeVecLayer); setVec(''); }

async function addUploadedVector(gj, filename) {
  const uid = 'up' + (++vecUid);
  const color = VEC_PALETTE[vecPaletteI++ % VEC_PALETTE.length];
  const labelProp = pickLabelProp(gj);
  const polyFilter = ['any', ['==', ['geometry-type'], 'Polygon'], ['==', ['geometry-type'], 'MultiPolygon']];
  const lineFilter = ['any', ['==', ['geometry-type'], 'Polygon'], ['==', ['geometry-type'], 'MultiPolygon'], ['==', ['geometry-type'], 'LineString'], ['==', ['geometry-type'], 'MultiLineString']];
  const ptFilter = ['any', ['==', ['geometry-type'], 'Point'], ['==', ['geometry-type'], 'MultiPoint']];
  map.addSource(uid, { type: 'geojson', data: gj });
  map.addLayer({ id: uid + '-fill', type: 'fill', source: uid, filter: polyFilter, paint: { 'fill-color': color, 'fill-opacity': 0.12 } });
  map.addLayer({ id: uid + '-line', type: 'line', source: uid, filter: lineFilter, paint: { 'line-color': color, 'line-width': 2.2 } });
  map.addLayer({ id: uid + '-pt', type: 'circle', source: uid, filter: ptFilter, paint: { 'circle-color': color, 'circle-radius': 5, 'circle-stroke-color': '#0a0c0e', 'circle-stroke-width': 1.5 } });
  let labelLayerId = null;
  if (labelProp) {
    labelLayerId = uid + '-label';
    map.addLayer({ id: labelLayerId, type: 'symbol', source: uid, layout: {
      'text-field': ['get', labelProp], 'text-font': ['Open Sans Regular'], 'text-size': 10, 'text-offset': [0, 0.9], 'text-anchor': 'top' },
      paint: { 'text-color': '#e9eef2', 'text-halo-color': '#0a0c0e', 'text-halo-width': 1.2 } });
  }
  const bounds = bboxOf(gj);
  vecLayers.push({ id: uid, name: filename, color, visible: true, labelOn: true, labelLayerId,
    layerIds: [uid + '-fill', uid + '-line', uid + '-pt'], removable: true, bounds });
  renderVecList();
  if (bounds) map.fitBounds(bounds, { padding: 90, maxZoom: 15, duration: 900 });
}
async function loadVectorFiles(files) {
  for (const file of files) {
    setVec('Reading ' + file.name + '…');
    try { const gj = await parseFile(file); await addUploadedVector(gj, file.name); setVec('Loaded ' + file.name, 'ok'); }
    catch (err) { console.error(err); setVec(file.name + ': could not read — try GeoJSON', 'err'); }
  }
}

// ---------- raster upload (COG-style GeoTIFF, or PNG/JPEG over current view) ----------
function fileToDataURL(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); }); }
function renderImgList() {
  const list = $('img-list');
  list.innerHTML = imgLayers.map(e => {
    const rows = [
      '<button class="icbtn" data-act="eye" title="Toggle visibility">' + (e.visible ? EYE_SVG : EYE_OFF_SVG) + '</button>',
      '<span class="lname" title="' + e.name.replace(/"/g, '&quot;') + '">' + e.name + '</span>',
      e.bounds ? '<button class="icbtn" data-act="zoom" title="Zoom to layer">' + EXPAND_SVG + '</button>' : '',
      '<button class="icbtn" data-act="remove" title="Remove">' + X_SVG + '</button>'
    ].join('');
    return '<div class="lrow' + (e.visible ? '' : ' muted') + '" data-id="' + e.id + '">' + rows + '</div>';
  }).join('');
}
async function addUploadedRaster(file) {
  const name = file.name.toLowerCase();
  const uid = 'ras' + (++imgUid);
  let bounds = null;
  if (name.endsWith('.tif') || name.endsWith('.tiff')) {
    const url = URL.createObjectURL(file);
    map.addSource(uid, { type: 'raster', url: 'cog://' + url, tileSize: 256 });
    map.addLayer({ id: uid, type: 'raster', source: uid, paint: { 'raster-opacity': 0.9 } });
  } else if (name.endsWith('.png') || name.endsWith('.jpg') || name.endsWith('.jpeg')) {
    const dataUrl = await fileToDataURL(file);
    const b = map.getBounds();
    const coords = [[b.getWest(), b.getNorth()], [b.getEast(), b.getNorth()], [b.getEast(), b.getSouth()], [b.getWest(), b.getSouth()]];
    map.addSource(uid, { type: 'image', url: dataUrl, coordinates: coords });
    map.addLayer({ id: uid, type: 'raster', source: uid, paint: { 'raster-opacity': 0.9 } });
    bounds = [[b.getWest(), b.getSouth()], [b.getEast(), b.getNorth()]];
  } else throw new Error('unsupported raster format');
  imgLayers.push({ id: uid, name: file.name, visible: true, removable: true, bounds });
  renderImgList();
}
async function loadRasterFiles(files) {
  for (const file of files) {
    setStatus('Reading ' + file.name + '…', 'load');
    try { await addUploadedRaster(file); setStatus('Loaded ' + file.name, 'ok'); }
    catch (err) { console.error(err); setStatus(file.name + ': could not load', 'err'); }
  }
}

// ---------- swipe compare (year A vs year B) ----------
let cmpSyncBound = false;
function syncMapB() {
  if (!mapB) return;
  mapB.jumpTo({ center: map.getCenter(), zoom: map.getZoom(), bearing: map.getBearing(), pitch: map.getPitch() });
}
function ensureMapB() {
  if (mapB) { syncMapB(); return; }
  mapB = new maplibregl.Map({
    container: 'map-b',
    style: { version: 8, sources: {}, layers: [], glyphs: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/{fontstack}/{range}.pbf' },
    center: map.getCenter(), zoom: map.getZoom(), bearing: map.getBearing(), pitch: map.getPitch(),
    maxZoom: 16, interactive: false, attributionControl: false, fadeDuration: 0
  });
  try { mapB.setProjection({ type: map.getProjection ? (map.getProjection().type || 'mercator') : 'mercator' }); } catch (e) {}
  mapB.on('load', () => {
    YEARS.forEach(y => ['sat', 'ndvi'].forEach(m => {
      const id = lid(y, m);
      mapB.addSource(id, { type: 'raster', url: urlFor(y, m), tileSize: 256 });
      mapB.addLayer({ id, type: 'raster', source: id, layout: { visibility: 'none' },
        paint: { 'raster-opacity': 1, 'raster-resampling': 'nearest', 'raster-fade-duration': 0 } });
    }));
    mapBReady = true;
    syncMapB();
    renderCompare();
  });
  // keep B camera locked to A across every camera-changing event
  if (!cmpSyncBound) {
    ['move', 'zoom', 'rotate', 'pitch', 'moveend', 'zoomend'].forEach(ev => map.on(ev, () => { if (compareOn) syncMapB(); }));
    cmpSyncBound = true;
  }
}

function setSwipe(frac) {
  swipeX = Math.max(0, Math.min(1, frac));
  const pct = (swipeX * 100).toFixed(2);
  $('map-b').style.clipPath = 'inset(0 0 0 ' + pct + '%)';
  $('swipe-divider').style.left = pct + '%';
}

function renderCompare() {
  // map A (base) shows year A; map B (overlay, clipped to right of divider) shows year B
  const aId = lid(cmpA, mode);
  const wantA = new Map([[aId, 1]]);
  shown.forEach(id => { if (!wantA.has(id) && map.getLayer(id)) map.setLayoutProperty(id, 'visibility', 'none'); });
  wantA.forEach((op, id) => { if (!map.getLayer(id)) return; map.setLayoutProperty(id, 'visibility', 'visible'); map.setPaintProperty(id, 'raster-opacity', op); });
  shown = new Set(wantA.keys());

  if (mapBReady) {
    const bId = lid(cmpB, mode);
    // hide every B raster except the wanted one, then show it
    YEARS.forEach(y => ['sat', 'ndvi'].forEach(m => {
      const id = lid(y, m);
      if (id !== bId && mapB.getLayer(id)) mapB.setLayoutProperty(id, 'visibility', 'none');
    }));
    if (mapB.getLayer(bId)) { mapB.setLayoutProperty(bId, 'visibility', 'visible'); mapB.setPaintProperty(bId, 'raster-opacity', 1); }
    shownB = new Set([bId]);
    syncMapB();
  }

  $('swipe-tag-a').textContent = cmpA + ' · ' + modeLabel();
  $('swipe-tag-b').textContent = cmpB + ' · ' + modeLabel();
  $('ro-year').textContent = cmpA + ' ⇔ ' + cmpB;
  $('ro-mode').textContent = modeLabel();
  $('ro-fade').innerHTML = '';
  $('legend').hidden = (mode !== 'ndvi');
  setStatus('Compare · ' + cmpA + ' vs ' + cmpB, 'ok');
}

function enterCompare() {
  compareOn = true;
  stopPlay();
  $('map-b').classList.add('on');
  $('swipe-divider').classList.add('on');
  $('compare-toggle').classList.add('compare-on');
  $('compare-row').hidden = false;
  $('scrub').disabled = true; $('prev').disabled = true; $('next').disabled = true; $('play').disabled = true;
  setSwipe(0.5);
  ensureMapB();
  // resize B (its container was display:none until now, so it needs a resize to pick up dimensions)
  requestAnimationFrame(() => { if (mapB) { mapB.resize(); syncMapB(); } });
  renderCompare();
}
function exitCompare() {
  compareOn = false;
  $('map-b').classList.remove('on');
  $('swipe-divider').classList.remove('on');
  $('compare-toggle').classList.remove('compare-on');
  $('compare-row').hidden = true;
  $('scrub').disabled = false; $('prev').disabled = false; $('next').disabled = false; $('play').disabled = false;
  if (mapBReady) { YEARS.forEach(y => ['sat', 'ndvi'].forEach(m => { const id = lid(y, m); if (mapB.getLayer(id)) mapB.setLayoutProperty(id, 'visibility', 'none'); })); shownB = new Set(); }
  render();
}

function wireCompare() {
  // populate A/B year selects
  const aSel = $('cmp-a'), bSel = $('cmp-b');
  YEARS.forEach(y => {
    aSel.insertAdjacentHTML('beforeend', '<option value="' + y + '">' + y + '</option>');
    bSel.insertAdjacentHTML('beforeend', '<option value="' + y + '">' + y + '</option>');
  });
  aSel.value = cmpA; bSel.value = cmpB;
  aSel.addEventListener('change', e => { cmpA = +e.target.value; renderCompare(); });
  bSel.addEventListener('change', e => { cmpB = +e.target.value; renderCompare(); });
  $('compare-toggle').addEventListener('click', () => compareOn ? exitCompare() : enterCompare());

  // divider drag
  const handle = $('swipe-handle');
  const startDrag = () => {
    const onMove = ev => {
      const clientX = ev.touches ? ev.touches[0].clientX : ev.clientX;
      setSwipe(clientX / window.innerWidth);
    };
    const onUp = () => {
      window.removeEventListener('mousemove', onMove); window.removeEventListener('mouseup', onUp);
      window.removeEventListener('touchmove', onMove); window.removeEventListener('touchend', onUp);
    };
    window.addEventListener('mousemove', onMove); window.addEventListener('mouseup', onUp);
    window.addEventListener('touchmove', onMove, { passive: true }); window.addEventListener('touchend', onUp);
  };
  handle.addEventListener('mousedown', e => { e.preventDefault(); startDrag(); });
  handle.addEventListener('touchstart', e => { startDrag(); }, { passive: true });
}

function wireControls() {
  $('scrub').addEventListener('input', e => { pos = +e.target.value; if (snap) pos = Math.round(pos); render(); });
  $('prev').addEventListener('click', () => step(-1));
  $('next').addEventListener('click', () => step(1));
  $('play').addEventListener('click', togglePlay);
  document.querySelectorAll('#tl-years button').forEach(b => b.addEventListener('click', () => setPos(+b.dataset.i)));
  document.querySelectorAll('.seg-btn').forEach(b => b.addEventListener('click', () => {
    mode = b.dataset.mode;
    document.querySelectorAll('.seg-btn').forEach(x => x.classList.toggle('on', x === b));
    render();
  }));
  $('snap').addEventListener('change', e => { snap = e.target.checked; if (snap) setPos(Math.round(pos)); if (playing) { stopPlay(); startPlay(); } });
  $('speed').addEventListener('input', e => { speed = +e.target.value; if (playing && snap) stepPlay(); });
  $('opacity').addEventListener('input', e => { opacity = +e.target.value / 100; $('op-val').textContent = e.target.value + '%'; render(); });
  $('gear').addEventListener('click', () => { opacity = 1; $('opacity').value = 100; $('op-val').textContent = '100%'; render(); });

  // vector layer list (built-ins + uploads)
  $('vec-list').addEventListener('click', e => {
    const btn = e.target.closest('button[data-act]'); if (!btn) return;
    const row = btn.closest('.lrow, .lrow-switch'); const entry = vecLayers.find(x => x.id === row.dataset.id); if (!entry) return;
    const act = btn.dataset.act;
    if (act === 'eye') toggleVecVisibility(entry);
    else if (act === 'label') toggleVecLabel(entry);
    else if (act === 'zoom') zoomToVecBounds(entry);
    else if (act === 'remove') removeVecLayer(entry);
  });
  const drop = $('drop'), fileInput = $('file');
  drop.addEventListener('click', () => fileInput.click());
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); if (e.dataTransfer.files.length) loadVectorFiles(Array.from(e.dataTransfer.files)); });
  fileInput.addEventListener('change', e => { if (e.target.files.length) loadVectorFiles(Array.from(e.target.files)); });
  $('clear-parcel').addEventListener('click', clearVectors);

  // uploaded raster list
  $('img-list').addEventListener('click', e => {
    const btn = e.target.closest('button[data-act]'); if (!btn) return;
    const row = btn.closest('.lrow'); const entry = imgLayers.find(x => x.id === row.dataset.id); if (!entry) return;
    const act = btn.dataset.act;
    if (act === 'eye') { entry.visible = !entry.visible; if (map.getLayer(entry.id)) map.setLayoutProperty(entry.id, 'visibility', entry.visible ? 'visible' : 'none'); renderImgList(); }
    else if (act === 'zoom') { if (entry.bounds) map.fitBounds(entry.bounds, { padding: 90, duration: 900 }); }
    else if (act === 'remove') { if (map.getLayer(entry.id)) map.removeLayer(entry.id); if (map.getSource(entry.id)) map.removeSource(entry.id); imgLayers = imgLayers.filter(x => x !== entry); renderImgList(); }
  });
  const rdrop = $('raster-drop'), rfile = $('raster-file');
  rdrop.addEventListener('click', () => rfile.click());
  rdrop.addEventListener('dragover', e => { e.preventDefault(); rdrop.classList.add('over'); });
  rdrop.addEventListener('dragleave', () => rdrop.classList.remove('over'));
  rdrop.addEventListener('drop', e => { e.preventDefault(); rdrop.classList.remove('over'); if (e.dataTransfer.files.length) loadRasterFiles(Array.from(e.dataTransfer.files)); });
  rfile.addEventListener('change', e => { if (e.target.files.length) loadRasterFiles(Array.from(e.target.files)); });

  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'ArrowRight') step(1);
    else if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  });
}
</script>
